services:
  - type: web
    name: gym-app
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /data
    disk:
      name: gym-db
      mountPath: /data
      sizeGB: 1
